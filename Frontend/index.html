<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Switcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Frontend Template</p>
        <h1>Music Switcher</h1>
      </div>

      <nav class="app-nav" aria-label="Primary navigation">
        <a href="#player">Player</a>
        <a href="#settings">Settings</a>
      </nav>
    </header>

    <main class="layout">
      <section id="player" class="card player-card">
        <div class="album-art" aria-hidden="true">
          <span>♪</span>
        </div>

        <div class="track-details">
          <p class="eyebrow">Now Playing</p>
          <h2>Context-aware playback</h2>
          <p>Music Switcher chooses a song from your selected Apple Music playlist.</p>
        </div>

        <div class="controls" aria-label="Music controls">
          <button id="play-btn" class="primary-button" type="button">Play</button>
        </div>
      </section>

      <section id="settings" class="card settings-card">
        <div class="section-header">
          <div>
            <p class="eyebrow">Customize</p>
            <h2>Settings</h2>
          </div>
        </div>

        <label class="field">
          <span>Apple Music playlist</span>
          <input
            id="playlist-name"
            type="text"
            placeholder="Enter an existing Apple Music playlist name"
            autocomplete="off"
          />
        </label>

        <label class="field">
          <span>Volume</span>
          <input id="volume-control" type="range" min="0" max="100" value="75" />
        </label>

        <label class="field checkbox-field">
          <input id="auto-switch" type="checkbox" checked />
          <span>Auto switch to next track</span>
        </label>

        <p id="connection-status" class="connection-status" role="status">
          Checking the local Music Switcher backend…
        </p>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
